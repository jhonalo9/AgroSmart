name: CI/CD AgroSmart AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. BACKEND: build + pruebas automatizadas (Spring Boot / Maven)
  # ---------------------------------------------------------------
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn -B verify

      - name: Guardar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-backend
          path: backend/target/surefire-reports
          if-no-files-found: ignore

      - name: Guardar el .jar generado
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  # ---------------------------------------------------------------
  # 2. FRONTEND: instalacion + build (Angular)
  # ---------------------------------------------------------------
  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (produccion)
        run: npm run build

      - name: Guardar el build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/agrosmart-frontend/browser

  # ---------------------------------------------------------------
  # 3. DOCKER: construir las imagenes (y publicarlas solo en main)
  # ---------------------------------------------------------------
  docker:
    name: Docker (build de imagenes)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de imagen en minusculas
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            ghcr.io/${{ env.REPO }}/backend:latest
            ghcr.io/${{ env.REPO }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ env.PUBLICAR == 'true' }}
          tags: |
            ghcr.io/${{ env.REPO }}/frontend:latest
            ghcr.io/${{ env.REPO }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------
  # 4. DESPLIEGUE SIMULADO (solo al hacer push a main)
  # ---------------------------------------------------------------
  deploy-simulado:
    name: Despliegue simulado
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: simulado
    steps:
      - uses: actions/checkout@v4

      - name: Validar la definicion del despliegue
        run: docker compose -f docker-compose.deploy.yml config --quiet

      - name: Simular despliegue
        run: |
          echo "1/4 Descargando imagenes desde ghcr.io (simulado)"
          echo "2/4 Levantando base de datos PostgreSQL (simulado)"
          echo "3/4 Levantando backend y frontend (simulado)"
          echo "4/4 Verificando salud del servicio (simulado)"
          echo "Despliegue simulado completado para el commit ${GITHUB_SHA::7}"

      - name: Resumen del despliegue
        run: |
          {
            echo "## Despliegue simulado - AgroSmart AI"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Entorno: simulado"
            echo "- Imagenes: \`ghcr.io/${GITHUB_REPOSITORY,,}/backend\` y \`.../frontend\`"
          } >> "$GITHUB_STEP_SUMMARY"
